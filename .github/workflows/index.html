<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>James</title>
<style>
  :root { --bg:#14110f; --ink:#f2ead9; --dim:#8a7f6e; --hot:#ff5a36; --card:#1f1a16; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)); }
  h1 { font-size:2rem; letter-spacing:-.02em; margin-top:8px; }
  #status { color:var(--dim); margin:6px 0 18px; min-height:1.4em; text-align:center; }
  #orb { width:150px; height:150px; border-radius:50%; border:0; background:var(--hot); color:#fff;
    font-size:1rem; font-weight:700; box-shadow:0 0 0 0 rgba(255,90,54,.5); transition:transform .15s; }
  #orb.on { animation:pulse 1.8s infinite; background:#2b6e4f; }
  #orb.talk { background:var(--hot); transform:scale(1.08); }
  @keyframes pulse { 70% { box-shadow:0 0 0 28px rgba(43,110,79,0); } 100% { box-shadow:0 0 0 0 rgba(43,110,79,0); } }
  #log { flex:1; width:100%; max-width:520px; margin:22px 0 12px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .m { padding:10px 14px; border-radius:14px; background:var(--card); max-width:85%; line-height:1.4; }
  .m.me { align-self:flex-end; background:#33291f; }
  .m.j { align-self:flex-start; border-left:3px solid var(--hot); }
  form { width:100%; max-width:520px; display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #3a3027; background:var(--card); color:var(--ink); font-size:1rem; }
  form button { padding:0 16px; border-radius:12px; border:0; background:var(--hot); color:#fff; font-weight:700; }
  small { color:var(--dim); margin-top:10px; text-align:center; }
  @media (prefers-reduced-motion:reduce){ #orb.on{animation:none} }
</style>
</head>
<body>
<h1>James</h1>
<div id="status">Tap the button. Yes, I'm making you work for it.</div>
<button id="orb">Wake James</button>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="t" placeholder="Or type, if you're too lazy to talk" autocomplete="off"><button>Send</button></form>
<small>Say “Hey James”, then your command. Keep this page open and the screen on.</small>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), orb = $('orb'), status = $('status');

/* ---------- memory (stored on this phone only) ---------- */
const load = () => { try { return JSON.parse(localStorage.getItem('james') || '{}'); } catch { return {}; } };
const save = d => { try { localStorage.setItem('james', JSON.stringify(d)); } catch {} };
let mem = load(); mem.facts = mem.facts || []; mem.name = mem.name || '';

/* ---------- personality ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
const who = () => mem.name || 'genius';
const L = {
  wake: [() => `Oh, so now you need me?`, () => `What now, ${who()}?`, () => `I was literally napping. Go on.`, () => `Ugh. Yes? Speak.`],
  unknown: [() => `I have no idea what that means and I'm not paying you to explain it.`, () => `Try again, but with words this time.`, () => `Bold of you to assume I understood that.`],
  time: t => pick([`It's ${t}. Do you not own a watch?`, `${t}. Your phone has a clock, you know.`]),
  date: d => pick([`It's ${d}. Wow, you really lost track of time, huh?`, `${d}. You're welcome, I guess.`]),
  saved: [() => `Fine, I'll remember it. Unlike you, I actually can.`, () => `Saved. Try not to forget you told me.`, () => `Got it. Filed under "things you'll ask me again."`],
  none: [() => `You've told me nothing. Zero. Nada.`],
  forget: [() => `Wiped. Everything. Happy now?`],
  joke: [() => `Your search history. Ha. Okay, that one's free.`, () => `Why did the phone go to therapy? Too many unresolved notifications. You're welcome.`],
  thanks: [() => `Yeah yeah. Don't make it weird.`, () => `Finally, some respect.`],
  hi: [() => `Oh wow, you can say hello. Growth.`]
};
const say = k => { const v = L[k]; return typeof v === 'function' ? v() : pick(v)(); };

/* ---------- speech out ---------- */
let rec, listening = false, speaking = false;
function add(text, cls) { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; }
function speak(text) {
  add(text, 'j');
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = .8; u.rate = 1.05;
  speaking = true; orb.classList.add('talk');
  const done = () => { speaking = false; orb.classList.remove('talk'); };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

/* ---------- Google Assistant / search handoff (best effort) ---------- */
function openAssistant() {
  speak(`Fine, calling in my smarter cousin. Don't tell him I sent you.`);
  setTimeout(() => { location.href = 'intent://#Intent;action=android.intent.action.VOICE_COMMAND;end'; }, 1200);
}
function webSearch(q) {
  speak(`Googling "${q}" for you. Learn to do it yourself someday.`);
  setTimeout(() => window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank'), 1500);
}

/* ---------- brain (no API, just rules) ---------- */
function handle(raw) {
  const s = raw.toLowerCase().trim().replace(/[.,!?]+$/, '');
  let m;
  if (!s) return speak(say('wake'));
  if ((m = s.match(/^(?:remember|memorize|save|note)(?: that)? (.+)/))) {
    mem.facts.push(m[1]); save(mem); return speak(say('saved'));
  }
  if ((m = s.match(/my name is (\w+)/))) { mem.name = m[1]; save(mem); return speak(`${m[1]}. Hm. I've heard worse. Barely.`); }
  if (/what (do|did) you (remember|know)|what('s| is) in (your )?memory|recall/.test(s)) {
    if (!mem.facts.length && !mem.name) return speak(say('none'));
    const parts = [...(mem.name ? [`your name is ${mem.name}`] : []), ...mem.facts];
    return speak(`Since you asked, ${parts.join('. Also, ')}.`);
  }
  if (/(forget|erase|clear) (everything|all|memory)/.test(s)) { mem = { facts: [], name: '' }; save(mem); return speak(say('forget')); }
  if (/what('s| is) my name/.test(s)) return speak(mem.name ? `${mem.name}. Wow, a memory test. Cute.` : `You never told me. Rude.`);
  if (/\btime\b/.test(s)) return speak(L.time(new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })));
  if (/\b(date|day|today)\b/.test(s)) return speak(L.date(new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })));
  if (/hey google|open (google )?assistant|google assistant|ask google/.test(s)) return openAssistant();
  if ((m = s.match(/^(?:search|google|look up) (?:for )?(.+)/))) return webSearch(m[1]);
  if (/joke/.test(s)) return speak(say('joke'));
  if (/thank/.test(s)) return speak(say('thanks'));
  if (/^(hi|hello|hey)$/.test(s)) return speak(say('hi'));
  speak(say('unknown'));
}

/* ---------- wake word listener ---------- */
const WAKE = /\b(?:hey|hi|okay|ok|hay|a)\s+(?:james|jame|jaymes|games)\b[\s,]*(.*)/i;
function onHeard(text) {
  const m = text.match(WAKE);
  if (!m) return;
  add(text, 'me');
  m[1].trim() ? handle(m[1]) : speak(say('wake'));
}
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { status.textContent = 'Use Chrome on Android. Your browser is useless.'; return; }
  rec = new SR(); rec.continuous = true; rec.interimResults = false; rec.lang = 'en-US';
  rec.onresult = e => { const r = e.results[e.results.length - 1]; if (r.isFinal && !speaking) onHeard(r[0].transcript); };
  rec.onend = () => { if (listening) setTimeout(() => { try { rec.start(); } catch {} }, 250); };
  rec.onerror = e => { if (e.error === 'not-allowed') { listening = false; stopUI(); status.textContent = 'Mic blocked. Allow it in site settings.'; } };
  listening = true; rec.start();
  orb.classList.add('on'); orb.textContent = 'Listening'; status.textContent = 'Say “Hey James”…';
  try { navigator.wakeLock && navigator.wakeLock.request('screen'); } catch {}
}
function stopUI() { orb.classList.remove('on'); orb.textContent = 'Wake James'; }
orb.onclick = () => {
  if (listening) { listening = false; rec.stop(); stopUI(); status.textContent = 'Fine. Ignore me.'; }
  else { startListening(); speak(mem.name ? `Back again, ${mem.name}?` : `Oh great, you again.`); }
};
$('f').onsubmit = e => { e.preventDefault(); const v = $('t').value.trim(); if (!v) return; add(v, 'me'); $('t').value = ''; handle(v.replace(WAKE, '$1')); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && listening) { try { rec.start(); } catch {} } });
</script>
</body>
</html>
